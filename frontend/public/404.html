<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Aidit</title>
    <script>
      // Single-page-apps-for-GitHub-Pages redirect trick (USER page variant).
      // pathSegmentsToKeep = 0 because this is a USER page served at root "/".
      // Captures the path/query/hash and redirects to /?/... so GitHub Pages
      // serves index.html, which then restores the route via history.replaceState.
      // See: https://github.com/rafgraph/spa-github-pages
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 1 + 0).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(0).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
