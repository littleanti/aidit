    <!-- NOTE (2026-07-28): the GitHub Pages deep-link trick was removed here —
         public/404.html wrote a /?/<path> redirect that a script in this head
         decoded back via history.replaceState. Deployment is self-hosted now, so
         deep links are handled the normal way: the static server rewrites
         unmatched paths to this file (nginx `try_files $uri $uri/ /index.html`).
         Keeping the decoder without its 404.html counterpart would be dead code
         that silently rewrites any URL whose query happens to start with "/". -->
