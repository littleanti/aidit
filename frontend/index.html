    <title>Aidit</title>
    <!-- SPA deep-link restore for GitHub Pages (rafgraph/spa-github-pages).
         Decodes the /?/... redirect written by 404.html back into the real
         path via history.replaceState so BrowserRouter resolves the deep link. -->
    <script>
      (function(l){
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          });
          window.history.replaceState(
            null, null,
            l.pathname.slice(0, -1) + decoded[0] +
            (decoded[1] ? '?' + decoded[1] : '') +
            l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
